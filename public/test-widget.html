<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка встройки виджета</title>
    <style>
        body { background:#f3f4f6; font-family: system-ui, sans-serif; padding:40px; max-width:1200px; margin:0 auto; color:#111; }
        .card { background:#fff; padding:20px; border-radius:12px; box-shadow:0 4px 6px rgba(0,0,0,.1); margin-top:20px; }
        .card.dark { background:#0a0a0a; color:#fff; }
        h2 { margin-top:0; }
        .note { font-size:13px; color:#6b7280; margin:4px 0 16px; }
        iframe { border:0; width:100%; height:680px; display:block; }
        .card.dark iframe { height:780px; }
    </style>
</head>
<body>
    <h1>Виджет на сайте дилера</h1>
    <p class="note">Проверяем обе темы. Светлая нужна для сайтов со светлым фоном — раньше виджет был только тёмным, и белый текст на светлой карточке не читался.</p>

    <div class="card">
        <h2>Светлая тема на светлом фоне</h2>
        <p class="note">?theme=light</p>
        <iframe src="http://localhost:3000/embed/lixiang-l9?theme=light" title="Структура цены Lixiang L9"></iframe>
    </div>

    <div class="card dark">
        <h2>Тёмная тема на тёмном фоне</h2>
        <p class="note">без параметра</p>
        <iframe src="http://localhost:3000/embed/zeekr-009" title="Структура цены Zeekr 009"></iframe>
    </div>
</body>
</html>
